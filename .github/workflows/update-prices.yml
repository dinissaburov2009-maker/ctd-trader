name: update-prices

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape prices
        run: node scripts/scrape.mjs

      - name: Save debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug-*.html
            debug-*.txt
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "ctd-bot"
          git config user.email "bot@users.noreply.github.com"
          # Коммитим ТОЛЬКО файлы парсера.
          # data/game-icons.json (родные эталоны из игры) бот не трогает никогда.
          git add data/prices.json data/history.json data/icons.json
          if git diff --cached --quiet; then
            echo "Нет изменений"
            exit 0
          fi
          git commit -m "update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push не удался, попытка $i из 3"
            sleep $((i * 5))
          done
          echo "Не удалось запушить после 3 попыток"
          exit 1
